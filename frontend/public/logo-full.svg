    <path d="M19 28H29" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <path d="M21 33H27" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Brand Typography -->
  <text x="64" y="27" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="20" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Cloth Bank</text>
  <text x="64" y="44" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="0.2">कपडा बैंक • NEPAL</text>
