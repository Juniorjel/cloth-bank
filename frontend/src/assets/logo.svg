<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="clothGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="warmthGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1E40AF" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded badge -->
  <rect width="48" height="48" rx="12" fill="url(#clothGradient)" />

  <!-- Protective shelter / Mountain roof outline -->
  <path d="M12 21L24 11L36 21" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Clothing Hanger / Folded garment curve -->
  <path d="M24 16V18.5C24 19.5 24.8 20.5 25.8 20.5C26.8 20.5 27.5 19.8 27.5 19" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Folded clothes / Heart warmth shape -->
  <path d="M16 23H32L30 35C30 36.5 28.5 37.5 27 37.5H21C19.5 37.5 18 36.5 18 35L16 23Z" fill="url(#warmthGradient)" />
  <path d="M19 28H29" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  <path d="M21 33H27" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
</svg>
